<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>仓库货物位置查询系统</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }

        body {
            background-color: #f5f7fa;
            color: #333;
            line-height: 1.6;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: linear-gradient(135deg, #2c3e50, #4a6491);
            color: white;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            position: relative;
        }

        /* 语言切换器样式 */
        .language-switcher {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
        }

        .lang-btn {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s;
            backdrop-filter: blur(5px);
        }

        .lang-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .lang-btn.active {
            background: #3498db;
            border-color: #3498db;
            font-weight: 600;
        }

        /* 移动端语言切换器调整 */
        @media (max-width: 768px) {
            .language-switcher {
                position: static;
                margin-top: 15px;
                justify-content: center;
            }

            .lang-btn {
                padding: 10px 20px;
                min-width: 120px;
            }
        }

        .header h1 {
            font-size: 2.2rem;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .search-section {
            background-color: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
            margin-bottom: 30px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .sap-label {
            font-size: 1.2rem;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 5px;
        }

        .input-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        @media (min-width: 768px) {
            .input-container {
                flex-direction: row;
                align-items: center;
            }
        }

        input[type="text"] {
            flex: 1;
            padding: 16px 20px;
            border: 2px solid #e1e5eb;
            border-radius: 8px;
            font-size: 1.1rem;
            transition: all 0.3s;
        }

        input[type="text"]:focus {
            border-color: #3498db;
            outline: none;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.2);
        }

        .search-btn {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 16px 30px;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .search-btn:hover {
            background-color: #2980b9;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .search-btn:active {
            transform: translateY(0);
        }

        .search-btn:disabled {
            background-color: #95a5a6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .results-section {
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }

        .results-header {
            padding: 20px 25px;
            background-color: #2c3e50;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .results-header h2 {
            font-size: 1.5rem;
        }

        .results-count {
            background-color: #3498db;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
        }

        #resultsContainer.results-container {
            overflow-x: auto !important;
            -webkit-overflow-scrolling: touch !important;
            display: block;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #7f8c8d;
            font-size: 1.1rem;
        }

        .no-results {
            text-align: center;
            padding: 60px 20px;
            color: #7f8c8d;
        }

        .no-results i {
            font-size: 3rem;
            margin-bottom: 20px;
            color: #bdc3c7;
        }

        .error-message {
            text-align: center;
            padding: 60px 20px;
            color: #e74c3c;
        }

        .error-message i {
            font-size: 3rem;
            margin-bottom: 20px;
        }

        /* 为表格设置一个绝对最小宽度，这是横向滚动的关键 */
        #resultsTable.results-table {
            min-width: 800px !important; /* 根据你的7列内容，可能需要850px或更多，请调整 */
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed; /* 使用固定布局，列宽由CSS明确指定，防止变形 */
        }

        /* 固定表头各列的宽度比例 (根据你原来的设定微调) */
        #resultsTable.results-table th:nth-child(1) { width: 15%; } /* SAP编码 */
        #resultsTable.results-table th:nth-child(2) { width: 8%;  } /* 单位 */
        #resultsTable.results-table th:nth-child(3) { width: 12%; } /* 库存数量 */
        #resultsTable.results-table th:nth-child(4) { width: 10%; } /* 存放位置 */
        #resultsTable.results-table th:nth-child(5) { width: 20%; } /* 货物名称 */
        #resultsTable.results-table th:nth-child(6) { width: 35%; } /* 产品描述 */

        /* 确保单元格内容正常换行，不撑开 */
        #resultsTable.results-table td,
        #resultsTable.results-table th {
            word-wrap: break-word; /* 允许长单词断行 */
            overflow-wrap: break-word; /* 更现代的标准 */
            padding: 12px 8px; /* 调整内边距，让布局更紧凑 */
            text-align: left;
            border-bottom: 1px solid #e1e5eb;
            vertical-align: top; /* 内容顶部对齐，避免高度不一 */
        }

        .results-table tr:hover {
            background-color: #f8f9fa;
        }

        .sap-code {
            font-weight: 600;
            color: #2c3e50;
        }

        .location {
            display: inline-block;
            padding: 6px 15px;
            background-color: #e8f4fc;
            border-radius: 20px;
            font-weight: 500;
            color: #2980b9;
        }

        .quantity {
            font-weight: 600;
            color: #27ae60;
        }

        .status {
            padding: 6px 12px;
            border-radius: 4px;
            font-weight: 500;
            font-size: 0.9rem;
        }

        .status.in-stock {
            background-color: #d5f4e6;
            color: #27ae60;
        }

        .status.low-stock {
            background-color: #fef9e7;
            color: #f39c12;
        }

        .status.out-of-stock {
            background-color: #fdebd0;
            color: #e67e22;
        }

        .footer {
            text-align: center;
            margin-top: 40px;
            padding: 20px;
            color: #7f8c8d;
            font-size: 0.9rem;
        }

        /* 移动端优化 */
        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8rem;
            }

            .search-section {
                padding: 20px;
            }

            .results-header {
                flex-direction: row;
                gap: 15px;
                align-items: flex-start;
            }

            .results-table {
                display: block;
                overflow-x: auto;
            }

            input[type="text"], .search-btn {
                width: 100%;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 15px;
            }

            .header {
                padding: 15px;
            }

            .header h1 {
                font-size: 1.5rem;
            }

            .results-table th,
            .results-table td {
                padding: 12px 10px;
                font-size: 0.9rem;
            }

            .location, .status {
                font-size: 0.8rem;
            }
        }

        /* 动画效果 */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .fade-in {
            animation: fadeIn 0.5s ease-out;
        }

        /* 位置2的样式 - 独立区域 */
        .data-status-section {
            background: #e8f4fc;
            border-radius: 8px;
            padding: 12px 20px;
            margin-bottom: 20px;
            border-left: 4px solid #3498db;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <!-- 语言切换器 -->
            <div class="language-switcher">
                <button class="lang-btn active" data-lang="zh">中文</button>
                <button class="lang-btn" data-lang="id">Bahasa Indonesia</button>
            </div>

            <h1><i class="fas fa-warehouse"></i> <span data-i18n="title">仓库货位速查</span></h1>
            <p><span data-i18n="subtitle">输入SAP编码快速查询货物在仓库中的位置和库存信息</span></p>

        </header>

        <!-- 在search-section上方添加新section -->
        <section class="data-status-section">
            <div class="container">
                <p><i class="fas fa-database"></i> <span data-i18n="updateText">数据最后更新于:  </span><strong id="lastUpdateTime">2025-01-10 20:30</strong> </p>
            </div>
        </section>

        <section class="search-section">
            <div class="input-group">
                <div class="sap-label"><span data-i18n="sapCodeLabel">SAP编码</span></div>
                <div class="input-container">
                    <input type="text" id="sapCode" placeholder="" autocomplete="off" data-placeholder-zh="请输入SAP编码，例如:4002010000" data-placeholder-id="Masukkan kode SAP, contoh: 4002010000">
                    <button class="search-btn" id="searchBtn">
                        <i class="fas fa-search"></i> <span data-i18n="searchButton">点击查询</span>
                    </button>
                </div>
            </div>
        </section>

        <section class="results-section">
            <div class="results-header">
                <h2><i class="fas fa-list-alt"></i> <span data-i18n="resultsTitle">查询结果</span></h2>
                <div class="results-count" id="resultsCount"><span data-i18n="resultsCount">共 0 条记录</span></div>
            </div>

            <div class="results-container" id="resultsContainer">
                <!-- 初始状态显示提示信息 -->
                <div class="no-results" id="initialMessage">
                    <i class="fas fa-search"></i>
                    <h3 data-i18n="initialTitle">请输入SAP编码进行查询</h3>
                    <p data-i18n="initialDesc">系统将显示货物在仓库中的所有位置和库存信息</p>
                </div>

                <!-- 加载状态 -->
                <div class="loading" id="loading" style="display: none;">
                    <i class="fas fa-spinner fa-spin fa-2x"></i>
                    <p data-i18n="loadingText">正在查询货物位置信息...</p>
                </div>

                <!-- 无结果状态 -->
                <div class="no-results" id="noResults" style="display: none;">
                    <i class="fas fa-box-open"></i>
                    <h3 data-i18n="noResultsTitle">未找到相关货物信息</h3>
                    <p data-i18n="noResultsDesc">请检查SAP编码是否正确，或联系仓库管理员</p>
                </div>

                <!-- 错误状态 -->
                <div class="error-message" id="errorMessage" style="display: none;">
                    <i class="fas fa-exclamation-triangle"></i>
                    <h3 data-i18n="errorTitle">查询失败</h3>
                    <p id="errorText" data-i18n="errorDesc">服务器连接失败，请稍后重试</p>
                </div>

                <!-- 查询结果表格 -->
                <table class="results-table" id="resultsTable" style="display: none;">
                    <thead>
                        <tr>
                            <th data-i18n="tableSap">SAP编码</th>
                            <th data-i18n="tableUnit">单位</th>
                            <th data-i18n="tableQuantity">库存数量</th>
                            <th data-i18n="tableLocation">存放位置</th>
                            <th data-i18n="tableName">货物名称</th>
                            <th data-i18n="tableDesc">产品描述</th>
                        </tr>
                    </thead>
                    <tbody id="resultsBody">
                        <!-- 结果将通过JavaScript动态添加 -->
                    </tbody>
                </table>
            </div>
        </section>

        <footer class="footer">
            <p><span data-i18n="footerText">仓库货物位置查询系统 © 2026 | 数据来源于服务器数据库</span></p>
        </footer>
    </div>

    <script>
        // --- 配置部分：必须修改！请替换成你的信息 ---
        const SUPABASE_URL = 'https://bnsbjgyulputgmqixjzs.supabase.co'; // 你的项目URL
        const SUPABASE_ANON_KEY = 'sb_publishable_AMpdOLRMYhtY32EbVrhEUg_d58mXmte'; // 你的Publishable key

        // 初始化Supabase客户端
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // --- 多语言支持部分 ---
        // 翻译词典
        const translations = {
            zh: {
                title: "仓库货位速查",
                subtitle: "输入SAP编码快速查询货物在仓库中的位置和库存信息",
                updateText: "数据最后更新于: ",
                sapCodeLabel: "SAP编码",
                searchButton: "点击查询",
                resultsTitle: "查询结果",
                resultsCount: "共 0 条记录",
                initialTitle: "请输入SAP编码进行查询",
                initialDesc: "系统将显示货物在仓库中的所有位置和库存信息",
                loadingText: "正在查询货物位置信息...",
                noResultsTitle: "未找到相关货物信息",
                noResultsDesc: "请检查SAP编码是否正确，或联系仓库管理员",
                errorTitle: "查询失败",
                errorDesc: "服务器连接失败，请稍后重试",
                tableSap: "SAP编码",
                tableUnit: "单位",
                tableQuantity: "库存数量",
                tableLocation: "存放位置",
                tableName: "货物名称",
                tableDesc: "产品描述",
                footerText: "货位速查 © 2026 | 查得到，找得准"
            },
            id: {
                title: "Cepat Cari Lokasi",
                subtitle: "Masukkan kode SAP untuk mencari lokasi dan informasi stok barang di gudang dengan cepat",
                updateText: "Data diperbarui: ",
                sapCodeLabel: "Kode SAP",
                searchButton: "Klik Cari",
                resultsTitle: "Hasil Pencarian",
                resultsCount: "Total 0 catatan",
                initialTitle: "Silakan masukkan kode SAP untuk mencari",
                initialDesc: "Sistem akan menampilkan semua lokasi dan informasi stok barang di gudang",
                loadingText: "Mencari informasi lokasi barang...",
                noResultsTitle: "Informasi barang tidak ditemukan",
                noResultsDesc: "Periksa apakah kode SAP benar, atau hubungi administrator gudang",
                errorTitle: "Pencarian gagal",
                errorDesc: "Koneksi server gagal, silakan coba lagi nanti",
                tableSap: "Kode SAP",
                tableUnit: "Unit",
                tableQuantity: "Jumlah Stok",
                tableLocation: "Lokasi",
                tableName: "Nama Barang",
                tableDesc: "Deskripsi Produk",
                footerText: "Cepat Cari Lokasi © 2026 | Bisa Dicari, Tepat Ditemukan"
            }
        };

        // 当前语言
        let currentLang = 'id';

        // 初始化语言
        function initLanguage() {
            // 从本地存储获取保存的语言设置
            const savedLang = localStorage.getItem('warehouse_lang');
            if (savedLang && (savedLang === 'zh' || savedLang === 'id')) {
                currentLang = savedLang;
            }

            // 更新界面语言
            updateLanguage();

            // 设置语言按钮状态
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.toggle('active', btn.getAttribute('data-lang') === currentLang);
            });
        }

        // 更新界面语言
        function updateLanguage() {
            // 更新所有带data-i18n属性的元素
            document.querySelectorAll('[data-i18n]').forEach(element => {
                const key = element.getAttribute('data-i18n');
                if (translations[currentLang][key]) {
                    // 处理结果计数特殊格式
                    if (key === 'resultsCount') {
                        const count = element.textContent.match(/\d+/)?.[0] || '0';
                        element.textContent = translations[currentLang][key].replace('0', count);
                    } else {
                        element.textContent = translations[currentLang][key];
                    }
                }
            });

            // 更新输入框placeholder
            const sapCodeInput = document.getElementById('sapCode');
            const placeholderKey = currentLang === 'zh' ? 'data-placeholder-zh' : 'data-placeholder-id';
            sapCodeInput.placeholder = sapCodeInput.getAttribute(placeholderKey);
        }

        // 切换语言
        function switchLanguage(lang) {
            if (lang === currentLang) return;

            currentLang = lang;

            // 保存到本地存储
            localStorage.setItem('warehouse_lang', lang);

            // 更新语言按钮状态
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.toggle('active', btn.getAttribute('data-lang') === lang);
            });

            // 更新界面语言
            updateLanguage();
        }

        // DOM元素
        const sapCodeInput = document.getElementById('sapCode');
        const searchBtn = document.getElementById('searchBtn');
        const resultsCount = document.getElementById('resultsCount');
        const resultsContainer = document.getElementById('resultsContainer');
        const initialMessage = document.getElementById('initialMessage');
        const loading = document.getElementById('loading');
        const noResults = document.getElementById('noResults');
        const errorMessage = document.getElementById('errorMessage');
        const errorText = document.getElementById('errorText');
        const resultsTable = document.getElementById('resultsTable');
        const resultsBody = document.getElementById('resultsBody');

        // 状态文本映射
        const statusText = {
            "in-stock": "库存充足",
            "low-stock": "库存不足",
            "out-of-stock": "无库存"
        };

        // 主查询函数
        async function searchGoods() {
            const sapCode = sapCodeInput.value.trim().toUpperCase();

            // 验证输入
            if (!sapCode) {
                alert(currentLang === 'zh' ? "请输入SAP编码" : "Silakan masukkan kode SAP");
                sapCodeInput.focus();
                return;
            }

            // 显示加载状态，禁用按钮
            initialMessage.style.display = 'none';
            noResults.style.display = 'none';
            errorMessage.style.display = 'none';
            resultsTable.style.display = 'none';
            loading.style.display = 'block';
            searchBtn.disabled = true;

            try {
                // 1. 执行Supabase查询（关键步骤）
                const { data, error } = await supabaseClient
                    .from('products') // 请确保你的表名是 'products'
                    .select('sap_code, product_name, product_description, unit, location, quantity') // 选择你的字段
                    .eq('sap_code', sapCode); // 按sap_code精确查询

                // 2. 检查查询错误
                if (error) throw error;

                // 隐藏加载状态，启用按钮
                loading.style.display = 'none';
                searchBtn.disabled = false;

                // 更新结果计数
                const countText = currentLang === 'zh'
                    ? `共 ${data.length || 0} 条记录`
                    : `Total ${data.length || 0} catatan`;
                const countSpan = resultsCount.querySelector('span');
                if (countSpan) {
                    countSpan.textContent = countText;
                } else {
                    resultsCount.textContent = countText;
                }

                // 3. 根据查询结果更新UI
                if (!data || data.length === 0) {
                    noResults.style.display = 'block';
                } else {
                    renderResults(data);
                    resultsTable.style.display = 'table';
                    resultsTable.classList.add('fade-in');
                }

            } catch (error) {
                // 处理错误
                console.error('查询失败:', error);
                loading.style.display = 'none';
                searchBtn.disabled = false;
                const errorMsg = currentLang === 'zh'
                    ? `查询失败: ${error.message}。请检查控制台或网络连接。`
                    : `Pencarian gagal: ${error.message}. Periksa konsol atau koneksi jaringan.`;
                errorText.textContent = errorMsg;
                errorMessage.style.display = 'block';
            }
        }

        // 渲染结果到表格
        function renderResults(results) {
            resultsBody.innerHTML = ''; // 清空旧结果
            results.forEach(item => {
                const row = document.createElement('tr');
                row.classList.add('fade-in');
                // 注意：这里使用的字段名与你数据库的字段名完全一致
                row.innerHTML = `
                    <td class="sap-code">${item.sap_code || ''}</td>
                    <td>${item.unit || ''}</td>
                    <td class="quantity">${item.quantity || 0} </td>
                    <td><span class="location">${item.location || ''}</span></td>
                    <td>${item.product_name || ''}</td>
                    <td>${item.product_description || ''}</td>
                `;
                resultsBody.appendChild(row);
            });
        }

        // 事件监听：按钮点击
        searchBtn.addEventListener('click', searchGoods);

        // 事件监听：按Enter键查询
        sapCodeInput.addEventListener('keyup', function(event) {
            if (event.key === 'Enter') searchGoods();
        });

        // 事件监听：语言切换按钮
        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                switchLanguage(this.getAttribute('data-lang'));
            });
        });

        // 页面加载时初始化
        window.addEventListener('load', () => {
            initLanguage();
            sapCodeInput.focus();
        });

        // 输入框选中文本功能
        sapCodeInput.addEventListener('focus', function() { this.select(); });
    </script>
</body>
</html>
